---
# A tag vX.Y.Z (the version and the image tag in appinfo/info.xml) becomes a release:
# - the External App's source as harvester-X.Y.Z.tar.gz on the Forgejo release, signed with
#   the app's key when there is one;
# - its image, built with Kaniko (the runners' job containers cannot run Docker or Buildah:
#   no Docker socket, no user namespaces), pushed as X.Y.Z to each registry that has a token.
# The homelab's nextcloud role builds the image from the tag itself and registers the app with
# that version, so a tag that differs from info.xml fails here.
#
# Registries (the same build, so the same digest, in each):
# - GitHub's: ghcr.io/<GHCR_OWNER>/harvester, with GHCR_TOKEN, a GitHub token (classic, scope
#   write:packages) of GHCR_USER (variables). info.xml names this one: registry
#   ghcr.io/<GHCR_OWNER>, image harvester (a mismatch is warned about);
# - Forgejo's: git.ciepiela.org/<owner>/harvester, with PACKAGES_TOKEN, the owner's token with
#   the scope write:package (the job's own token may not push packages: 401 reqPackageAccess,
#   measured 2026-10-31). The fallback: an admin maps ghcr.io/<GHCR_OWNER> to
#   git.ciepiela.org/<owner> (occ app_api:daemon:registry:add), as AppAPI replaces only the
#   registry part of the image's name.
# Without a token the image is built and checked, not pushed.
#
# Not published on the Nextcloud app store yet (no store certificate for harvester).
#
# Secrets: APP_SIGNING_KEY, the private key of an app store certificate for harvester (PEM);
# PACKAGES_TOKEN and GHCR_TOKEN as above. Variables: GHCR_USER, GHCR_OWNER.
#
# Run by hand ("tag": an existing tag) to make the release of a tag pushed before this
# workflow existed: fj actions dispatch release.yml main -I tag=v0.3.0.
name: Release
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z)
        required: true

jobs:
  release:
    runs-on: docker
    outputs:
      registry: ${{ steps.version.outputs.registry }}
      image: ${{ steps.version.outputs.image }}
    container: docker.io/library/debian:bookworm-slim
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the tools
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends ca-certificates curl git jq openssl >/dev/null

      - name: Check out the tag
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "$TAG is not a release tag"; exit 1;; esac
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -q "$TAG"

      - name: Check the tag is the app's version and image tag
        id: version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          image=$(sed -n 's:.*<image-tag>\(.*\)</image-tag>.*:\1:p' appinfo/info.xml)
          test "v$version" = "$TAG" || { echo "info.xml says version $version, the tag is $TAG"; exit 1; }
          test "$image" = "$version" || { echo "info.xml's image tag $image differs from its version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "registry=$(sed -n 's:.*<registry>\(.*\)</registry>.*:\1:p' appinfo/info.xml)"
            echo "image=$(sed -n 's:.*<image>\(.*\)</image>.*:\1:p' appinfo/info.xml)"
          } >> "$GITHUB_OUTPUT"

      # The source the image is built from (what Git tracks, without CI and tests), in a
      # folder named as the app, reproducible from the tag.
      - name: Build the archive
        run: |
          git archive --format=tar --prefix=harvester/ "$TAG" -- . ':!.forgejo' ':!tests' ':!renovate.json' \
            | gzip -n > "harvester-$VERSION.tar.gz"
          # Counted, not piped to head: with pipefail, head's early exit fails the step (SIGPIPE).
          echo "$(tar -tzf "harvester-$VERSION.tar.gz" | wc -l) entries"
          ls -l "harvester-$VERSION.tar.gz"

      - name: Sign the archive
        env:
          KEY: ${{ secrets.APP_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::No APP_SIGNING_KEY: the archive is not signed"; exit 0; fi
          umask 077 && printf '%s\n' "$KEY" > /tmp/key.pem
          openssl dgst -sha512 -sign /tmp/key.pem "harvester-$VERSION.tar.gz" | openssl base64 -A > signature.txt
          rm /tmp/key.pem

      - name: Attach the archive to the release
        run: |
          auth="Authorization: token $TOKEN"
          id=$(curl -fsS -H "$auth" "$API/releases/tags/$TAG" | jq -r .id) || id=""
          if [ -z "$id" ] || [ "$id" = null ]; then
            id=$(jq -n --arg t "$TAG" '{tag_name: $t, name: $t}' \
              | curl -fsS -H "$auth" -H 'Content-Type: application/json' -d @- "$API/releases" | jq -r .id)
          fi
          for name in "harvester-$VERSION.tar.gz" signature.txt; do
            [ -f "$name" ] || continue
            old=$(curl -fsS -H "$auth" "$API/releases/$id/assets" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
            [ -n "$old" ] && curl -fsS -X DELETE -H "$auth" "$API/releases/$id/assets/$old"
            url=$(curl -fsS -H "$auth" -F "attachment=@$name" "$API/releases/$id/assets?name=$name" | jq -r .browser_download_url)
            echo "$name: $url"
          done

  image:
    needs: release
    runs-on: docker
    # The debug image has a shell (busybox) for the steps.
    container: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SERVER: ${{ github.server_url }}
      REPOSITORY: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Build and push the image
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          INFO_REGISTRY: ${{ needs.release.outputs.registry }}
          INFO_IMAGE: ${{ needs.release.outputs.image }}
          GHCR_USER: ${{ vars.GHCR_USER }}
          GHCR_OWNER: ${{ vars.GHCR_OWNER }}
        run: |
          set -eu
          version=${TAG#v}
          host=${SERVER#https://}
          auths="" destinations=""
          add() {  # registry, user, token, image
            auths="$auths${auths:+,}\"$1\":{\"auth\":\"$(printf '%s:%s' "$2" "$3" | base64 | tr -d '\n')\"}"
            destinations="$destinations --destination=$4:$version --destination=$4:latest"
            echo "Pushing to $4:$version and :latest"
          }
          if [ -n "$GHCR_TOKEN" ] && [ -n "$GHCR_USER" ] && [ -n "$GHCR_OWNER" ]; then
            add ghcr.io "$GHCR_USER" "$GHCR_TOKEN" "ghcr.io/$GHCR_OWNER/harvester"
            if [ "$INFO_REGISTRY/$INFO_IMAGE" != "ghcr.io/$GHCR_OWNER/harvester" ]; then
              echo "::warning::info.xml names $INFO_REGISTRY/$INFO_IMAGE, the image goes to ghcr.io/$GHCR_OWNER/harvester"
            fi
          fi
          if [ -n "$PACKAGES_TOKEN" ]; then add "$host" "$OWNER" "$PACKAGES_TOKEN" "$host/$OWNER/harvester"; fi
          printf '{"auths":{%s}}' "$auths" > /kaniko/.docker/config.json
          if [ -z "$destinations" ]; then
            echo "::warning::No registry token: the image is built, not pushed"
            destinations="--no-push"
          fi
          # From the tag through Git (TLS checked), not through busybox's wget (which is not).
          # Kaniko replaces the root filesystem while it builds: everything stays below /kaniko.
          # shellcheck disable=SC2086
          /kaniko/executor \
            --context "git://${host}/${REPOSITORY}.git#refs/tags/${TAG}" \
            --dockerfile Dockerfile \
            --label "org.opencontainers.image.source=${SERVER}/${REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            $destinations


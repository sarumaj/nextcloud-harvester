---
# The tests (no Nextcloud, no network; the browser's in Chromium against a fake site), formatting and lint of the app's Python, its
# page's script and its shell scripts, info.xml against the app store's schema, and the Markdown; and the image on a real
# Nextcloud with AppAPI and PostgreSQL (job server): registered and enabled there, its page, settings and occ command, a
# website job saving into the admin's files over WebDAV, and the recorder's browser (tests/server/check.sh).
name: CI
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
"on":
  push:
    # Renovate's branches too: it merges its updates only once their checks passed.
    branches: [main, "renovate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: docker
    container: docker.io/library/python:3.15-slim-bookworm
    # The suite runs browsers against fake sites: some 8 minutes on an idle runner.
    timeout-minutes: 30
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -qq -y git nodejs shellcheck curl libxml2-utils >/dev/null
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Install the dependencies
        run: |
          # As the Dockerfile: urllib3-future beside upstream urllib3, not over it.
          URLLIB3_NO_OVERRIDE=1 pip install -q --no-binary=urllib3-future -r requirements-dev.txt
          playwright install --with-deps --no-shell chromium >/dev/null
          # rclone for the remote source's test, the same release and check as the Dockerfile's.
          version=$(sed -n 's/^ARG RCLONE_VERSION=//p' Dockerfile)
          sha=$(sed -n 's/^ARG RCLONE_AMD64_SHA256=//p' Dockerfile)
          curl -fsSL "https://github.com/rclone/rclone/releases/download/v$version/rclone-v$version-linux-amd64.zip" -o /tmp/rclone.zip
          echo "$sha  /tmp/rclone.zip" | sha256sum -c -
          python3 -c "import zipfile; z = zipfile.ZipFile('/tmp/rclone.zip'); open('/usr/local/bin/rclone', 'wb').write(z.read(next(n for n in z.namelist() if n.endswith('/rclone'))))"
          chmod +x /usr/local/bin/rclone

      # The store's schema does not know AppAPI's routes (external-app/routes), which AppAPI
      # reads from info.xml: everything else is checked.
      - name: Check info.xml against the app store's schema
        run: |
          curl -fsSL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          sed '/<routes>/,/<\/routes>/d' appinfo/info.xml > /tmp/info.xml
          xmllint --noout --schema /tmp/info.xsd /tmp/info.xml

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the formatting
        run: black --check ex_app tests

      - name: Lint the Python
        run: pylint ex_app/lib tests

      - name: Check the page's scripts parse
        run: node --check ex_app/js/harvester-main.js && node --check ex_app/lib/harvester/browser/recorder.js && node --check ex_app/lib/harvester/browser/consent.js

      - name: Check the shell scripts
        run: shellcheck start.sh healthcheck.sh tests/server/check.sh

  server:
    # A whole Ubuntu with rootless Docker: the image built and registered with AppAPI on a real
    # Nextcloud (the shared action, a manual-install deploy daemon without HaRP), where pytest
    # has fakes of Nextcloud.
    runs-on: ubuntu-latest
    # The image's build takes some 3 minutes without a cache, a server's check about one.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Nextcloud info.xml supports and the newest released one (36 has no image yet).
        nextcloud: ["32", "35"]
    steps:
      - name: Check out
        run: |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Build the image
        run: docker build -t harvester:ci .

      - name: Check the app on Nextcloud ${{ matrix.nextcloud }}
        uses: https://git.ciepiela.org/dawid/ci-actions/nextcloud-app-server@main
        with:
          app-id: harvester
          app-dir: .
          nextcloud: ${{ matrix.nextcloud }}
          exapp-image: harvester:ci
          check: tests/server/check.sh
          # Docs, translations or the other tests alone need no server (the image is built all
          # the same: the action decides).
          paths: >-
            ex_app/** appinfo/** Dockerfile start.sh healthcheck.sh requirements.txt
            tests/server/** tests/fake_site.py .forgejo/workflows/ci.yml

  markdown:
    runs-on: docker
    container: docker.io/library/node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Check out
        run: |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Lint the Markdown
        run: npx --yes markdownlint-cli2 "*.md" "docs/**/*.md"

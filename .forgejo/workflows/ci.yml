---
# The tests (no Nextcloud, no network; the browser's in Chromium against a fake site), formatting and lint of the app's Python, its
# page's script and its shell scripts.
name: CI
enable-email-notifications: true
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: docker
    container: docker.io/library/python:3.15-slim-bookworm
    timeout-minutes: 15
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -qq -y git nodejs shellcheck curl >/dev/null
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Install
        run: |
          pip install -q -r requirements-dev.txt
          playwright install --with-deps chromium >/dev/null
          # rclone for the remote source's test, the same release and check as the Dockerfile's.
          version=$(sed -n 's/^ARG RCLONE_VERSION=//p' Dockerfile)
          sha=$(sed -n 's/^ARG RCLONE_AMD64_SHA256=//p' Dockerfile)
          curl -fsSL "https://github.com/rclone/rclone/releases/download/v$version/rclone-v$version-linux-amd64.zip" -o /tmp/rclone.zip
          echo "$sha  /tmp/rclone.zip" | sha256sum -c -
          python3 -c "import zipfile; z = zipfile.ZipFile('/tmp/rclone.zip'); open('/usr/local/bin/rclone', 'wb').write(z.read(next(n for n in z.namelist() if n.endswith('/rclone'))))"
          chmod +x /usr/local/bin/rclone

      - name: Tests
        run: python -m pytest -q

      - name: Formatting
        run: black --check ex_app tests

      - name: Lint
        run: pylint ex_app/lib tests

      - name: Page script
        run: node --check ex_app/js/harvester-main.js && node --check ex_app/lib/harvester/browser/recorder.js

      - name: Shell scripts
        run: shellcheck start.sh healthcheck.sh

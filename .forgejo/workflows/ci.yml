---
# The tests (no Nextcloud, no network; the browser's in Chromium against a fake site), formatting and lint of the app's Python, its
# page's script and its shell scripts.
name: CI
enable-email-notifications: true
"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: docker
    container: docker.io/library/python:3.12-slim-bookworm
    timeout-minutes: 15
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -qq -y git nodejs shellcheck >/dev/null
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Install
        run: |
          pip install -q -r requirements-dev.txt
          playwright install --with-deps --only-shell chromium >/dev/null

      - name: Tests
        run: python -m pytest -q

      - name: Formatting
        run: black --check ex_app tests

      - name: Lint
        run: pylint ex_app/lib tests

      - name: Page script
        run: node --check ex_app/js/harvester-main.js

      - name: Shell scripts
        run: shellcheck start.sh healthcheck.sh
